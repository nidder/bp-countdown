<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ellie & Nida's BLACKPINK Countdown</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto:wght@400;700&display=swap');

        body {
          margin: 0;
          font-family: 'Roboto', sans-serif;
          background: linear-gradient(to right, #0f0c29, #302b63, #24243e);
          color: #fff;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          padding: 20px;
          text-align: center;
        }

        h1 {
          font-size: 3em;
          margin: 0.2em 0;
          background: linear-gradient(90deg, #ff6ec4, #7873f5);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          font-family: 'Orbitron', sans-serif;
          letter-spacing: 2px;
          text-shadow: 0 0 10px #ff6ec4;
        }

        #countdown {
          font-size: 2em;
          margin: 1.5em 0;
          display: flex;
          gap: 1em;
          flex-wrap: wrap;
          justify-content: center;
        }

        .countdown-block {
          background: rgba(255, 255, 255, 0.1);
          border-radius: 15px;
          padding: 1em 1.5em;
          box-shadow: 0 0 15px #ff69b4;
          backdrop-filter: blur(8px);
        }

        .countdown-number {
          font-size: 2.5em;
          font-weight: bold;
          color: #ff69b4;
        }

        .countdown-label {
          font-size: 1em;
          color: #ffffff;
          margin-top: 0.3em;
        }

        img.gif {
          width: 300px;
          max-width: 90%;
          margin-top: 2em;
          border-radius: 15px;
          box-shadow: 0 0 25px #ff69b4;
        }

        @media (max-width: 600px) {
          h1 {
            font-size: 2em;
          }

          .countdown-number {
            font-size: 2em;
          }
        }
    </style>
</head>
<body>
<h1>💖 Ellie & Nida's 💖</h1>
<h1>BLACKPINK Countdown</h1>

<div id="countdown">Loading...</div>

<img src="/images/blackpinkdance.gif" alt="BLACKPINK Dancing" class="gif">

<script>
    async function fetchCountdown() {
      try {
        const response = await fetch("/countdown");
        const data = await response.json();

        const parts = [
          { label: "Days", value: data.days },
          { label: "Hours", value: data.hours },
          { label: "Minutes", value: data.minutes },
          { label: "Seconds", value: data.seconds }
        ];

        document.getElementById("countdown").innerHTML = parts.map(p =>
          `<div class="countdown-block">
             <div class="countdown-number">${p.value}</div>
             <div class="countdown-label">${p.label}</div>
           </div>`).join('');
      } catch (err) {
        document.getElementById("countdown").innerText = "Countdown failed to load 😢";
        console.error(err);
      }
    }

    fetchCountdown();
    setInterval(fetchCountdown, 1000);
</script>
</body>
</html>
