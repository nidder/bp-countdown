<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BLACKPINK Countdown</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
          font-family: 'Bebas Neue', cursive;
          background-color: #1e1e1e;
          color: #ff7eb9;
          text-align: center;
          padding: 20px;
          box-sizing: border-box;
          overflow-x: hidden;
          position: relative;
        }

        h1 {
          font-size: 3em;
          letter-spacing: 2px;
          margin: 0;
          position: relative;
          z-index: 2;
        }

        .title-line {
          background: none;
          color: #ff7eb9;
          text-shadow: 0 0 5px #ff7eb9;
        }

        .highlight {
          font-size: 3.5em;
          background: linear-gradient(90deg, #ff7eb9, #ff85b8);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: pulse 2s infinite alternate;
          margin: 0;
          z-index: 2;
          position: relative;
        }

        @keyframes pulse {
          from { text-shadow: 0 0 10px #ff7eb9; }
          to { text-shadow: 0 0 20px #ff6ec4; }
        }

        #countdown {
          font-size: 2em;
          margin-top: 20px;
          color: #ff7eb9;
          text-shadow: 0 0 4px #ff7eb9, 0 0 8px #ff1493;
        }

        .countdown-box {
          display: inline-block;
          margin: 10px;
          padding: 20px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 10px;
          box-shadow: 0 0 20px #ff7eb9, 0 0 30px #ff1493;
        }

        .countdown-number {
          color: #e07bc2;
          font-weight: bold;
          font-size: 3em;
        }

        .countdown-text {
          color: #fff;
        }

        .gif {
          padding: 20px;
          max-width: 100%;
          height: auto;
          border: 5px solid #ff7eb9;
          border-radius: 15px;
          box-shadow: 0 0 20px #ff7eb9, 0 0 30px #ff1493;
          animation: pulse-border 2s infinite alternate;
          z-index: 2;
          position: relative;
        }

        @keyframes pulse-border {
          from { box-shadow: 0 0 10px #ff7eb9; }
          to { box-shadow: 0 0 30px #ff1493; }
        }

        .lightstick {
          position: absolute;
          top: 15%;
          width: 130px;
          z-index: 3;
          opacity: 1;
          filter: drop-shadow(0 0 10px #ff7eb9);
          animation: glowPulse 2s infinite alternate;
        }

        .left-stick {
          left: 10%;
          transform: scaleX(-1);
        }

        .right-stick {
          right: 10%;
        }

        @keyframes glowPulse {
          from { filter: drop-shadow(0 0 10px #ff7eb9); }
          to   { filter: drop-shadow(0 0 20px #ff1493); }
        }

        body::before {
          content: "";
          position: fixed;
          top: 0; left: 0;
          width: 100%;
          height: 100%;
          background: radial-gradient(circle, #ff7eb9 1px, transparent 1px);
          background-size: 20px 20px;
          opacity: 0.04;
          z-index: 0;
          animation: backgroundFade 5s infinite alternate;
        }

        @keyframes backgroundFade {
          from { opacity: 0.02; }
          to   { opacity: 0.07; }
        }

        .floating-stars {
          position: fixed;
          width: 100%;
          height: 100%;
          pointer-events: none;
          overflow: hidden;
          z-index: 0;
        }

        .floating-stars span {
          position: absolute;
          display: block;
          width: 6px;
          height: 6px;
          background: radial-gradient(circle, #fff, #ffb6c1);
          border-radius: 50%;
          opacity: 0.8;
          filter: blur(2px);
          animation: floatUp 8s linear infinite;
        }

        .floating-stars span::before {
          content: "";
          position: absolute;
          width: 100%;
          height: 100%;
          background: radial-gradient(circle, #fff, transparent);
          border-radius: 50%;
          opacity: 0.7;
          animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes floatUp {
          0% {
            transform: translateY(100vh) scale(0.8);
            opacity: 0;
          }
          50% {
            opacity: 0.6;
          }
          100% {
            transform: translateY(-10vh) scale(1.2);
            opacity: 0;
          }
        }

        @keyframes twinkle {
          0%, 100% {
            opacity: 0.3;
            transform: scale(1);
          }
          50% {
            opacity: 1;
            transform: scale(1.5);
          }
        }

        @media (max-width: 768px) {
          h1 { font-size: 2.2em; }
          .highlight { font-size: 3em; }
          #countdown { font-size: 1.5em; }
          .lightstick { width: 90px; top: 15%; }
        }

        @media (max-width: 480px) {
          h1 { font-size: 1.8em; }
          .highlight { font-size: 2.5em; }
          #countdown { font-size: 1.2em; }
          .countdown-box {
            padding: 15px;
            font-size: 1.5em;
          }
          .countdown-number {
            font-size: 2.5em;
          }
        }
    </style>
</head>

<body>
<div class="floating-stars">
    <span style="left: 5%; animation-delay: 0s;"></span>
    <span style="left: 15%; animation-delay: 3s;"></span>
    <span style="left: 25%; animation-delay: 1s;"></span>
    <span style="left: 35%; animation-delay: 4s;"></span>
    <span style="left: 45%; animation-delay: 2s;"></span>
    <span style="left: 55%; animation-delay: 5s;"></span>
    <span style="left: 65%; animation-delay: 1s;"></span>
    <span style="left: 75%; animation-delay: 2.5s;"></span>
    <span style="left: 85%; animation-delay: 3.5s;"></span>
    <span style="left: 95%; animation-delay: 1.5s;"></span>
</div>

<img src="static/images/lightsticks.jpg" class="lightstick left-stick" alt="Lightstick Left">
<img src="static/images/lightsticks.jpg" class="lightstick right-stick" alt="Lightstick Right">

<h1 class="title-line">Ellie 🐣 & Nida 🥚</h1>
<h1 class="highlight">BLACKPINK Concert Countdown</h1>

<div id="countdown">
    <div class="countdown-box"><span class="countdown-number" id="days">00</span> <span class="countdown-text">days</span></div>
    <div class="countdown-box"><span class="countdown-number" id="hours">00</span> <span class="countdown-text">hours</span></div>
    <div class="countdown-box"><span class="countdown-number" id="minutes">00</span> <span class="countdown-text">minutes</span></div>
    <div class="countdown-box"><span class="countdown-number" id="seconds">00</span> <span class="countdown-text">seconds</span></div>
</div>

<img src="static/images/blackpinkdance.gif" alt="BlackPink Dance GIF" class="gif">

<script>
    async function fetchCountdown() {
      try {
        const response = await fetch("/countdown");
        const data = await response.json();

        if (data.days === 0 && data.hours === 0 && data.minutes === 0 && data.seconds === 0) {
          triggerConfetti();
          document.getElementById("countdown").innerHTML = "💥 IT’S BLACKPINK TIME 💥";
        } else {
          document.getElementById("days").innerText = data.days;
          document.getElementById("hours").innerText = data.hours;
          document.getElementById("minutes").innerText = data.minutes;
          document.getElementById("seconds").innerText = data.seconds;
        }
      } catch (error) {
        console.error("Error fetching countdown:", error);
        document.getElementById("countdown").innerText = "Failed to load countdown.";
      }
    }

    function triggerConfetti() {
      const duration = 7 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function () {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        confetti(Object.assign({}, defaults, {
          particleCount: 100,
          origin: {
            x: randomInRange(0.1, 0.9),
            y: Math.random() - 0.2
          }
        }));
      }, 250);
    }

    fetchCountdown();
    setInterval(fetchCountdown, 1000);
</script>
</body>
</html>
