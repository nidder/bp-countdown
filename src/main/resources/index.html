<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ellie & Nida's BLACKPINK Countdown</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
          font-family: 'Bebas Neue', cursive;
          background-color: #000;
          color: #ff69b4;
          text-align: center;
          padding: 20px;
          overflow-x: hidden;
          box-sizing: border-box;
        }

        h1 {
          font-size: 3em;
          letter-spacing: 2px;
          text-transform: uppercase;
          background: linear-gradient(90deg, #ff69b4, #ffc0cb);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: pulse 2s infinite alternate;
          margin: 10px 0;
          position: relative;
          z-index: 2;
        }

        .emoji {
          -webkit-text-fill-color: initial;
          background: none;
          text-shadow: none;
        }

        @keyframes pulse {
          from { text-shadow: 0 0 10px #ff69b4; }
          to { text-shadow: 0 0 20px #ff6ec4; }
        }

        #countdown {
          font-size: 2em;
          margin-top: 20px;
          color: #ff69b4;
          text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
        }

        .countdown-number {
          color: #D5006D;
          font-weight: bold;
        }

        .countdown-text {
          color: #ffffff;
        }

        .sparkles {
          font-size: 2em;
          animation: sparkle 2s infinite;
          margin-top: 10px;
          z-index: 2;
          position: relative;
        }

        @keyframes sparkle {
          0% { transform: scale(1); opacity: 0.8; }
          50% { transform: scale(1.2); opacity: 1; }
          100% { transform: scale(1); opacity: 0.8; }
        }

        .lightstick {
          position: absolute;
          top: 50%;
          width: 60px;
          transform: translateY(-50%);
          z-index: 1;
          opacity: 0.9;
        }

        .left-stick {
          left: 10px;
          transform: translateY(-50%) scaleX(-1); /* Flipped */
        }

        .right-stick {
          right: 10px;
        }

        body::before {
          content: "";
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: radial-gradient(circle, rgba(255,105,180,0.1) 0%, rgba(0,0,0,0.6) 70%);
          animation: fadeLights 6s ease-in-out infinite alternate;
          z-index: 0;
          pointer-events: none;
        }

        @keyframes fadeLights {
          0% { opacity: 0.2; }
          100% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
          h1 { font-size: 2.5em; }
          #countdown { font-size: 1.5em; }
          .lightstick { width: 40px; }
        }

        @media (max-width: 480px) {
          h1 { font-size: 2em; }
          #countdown { font-size: 1.2em; }
        }
    </style>
</head>

<body>
<img src="static/images/lightsticks.png" class="lightstick left-stick" alt="Lightstick Left Image">
<img src="static/images/lightsticks.png" class="lightstick right-stick" alt="Lightstick Right Image">

<h1>
    <span class="emoji">💖</span> Ellie
    <span class="emoji">🐣</span> &amp; Nida
    <span class="emoji">🥚</span> <span class="emoji">💖</span>
</h1>
<h1>BLACKPINK Concert Countdown</h1>

<div id="countdown">Loading...</div>
<div class="sparkles">✨💫🌟</div>

<script>
    async function fetchCountdown() {
      try {
        const response = await fetch("/countdown");
        const data = await response.json();

        if (data.days === 0 && data.hours === 0 && data.minutes === 0 && data.seconds === 0) {
          triggerConfetti();
          document.getElementById("countdown").innerHTML = "💥 IT’S BLACKPINK TIME 💥";
        } else {
          document.getElementById("countdown").innerHTML =
            `<span class="countdown-number">${data.days}</span> <span class="countdown-text">days</span>, ` +
            `<span class="countdown-number">${data.hours}</span> <span class="countdown-text">hours</span>, ` +
            `<span class="countdown-number">${data.minutes}</span> <span class="countdown-text">minutes</span>, ` +
            `<span class="countdown-number">${data.seconds}</span> <span class="countdown-text">seconds</span>`;
        }
      } catch (error) {
        console.error("Error fetching countdown:", error);
        document.getElementById("countdown").innerText = "Failed to load countdown.";
      }
    }

    function triggerConfetti() {
      const duration = 7000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(() => {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        confetti(Object.assign({}, defaults, {
          particleCount: 100,
          origin: {
            x: randomInRange(0.1, 0.9),
            y: Math.random() - 0.2
          }
        }));
      }, 250);
    }

    fetchCountdown();
    setInterval(fetchCountdown, 1000);
</script>
</body>
</html>
