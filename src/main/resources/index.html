<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BLACKPINK Countdown</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
          font-family: 'Bebas Neue', cursive;
          background-color: #000;
          color: #ff69b4;
          text-align: center;
          padding: 20px;
          box-sizing: border-box;
          overflow-x: hidden;
          position: relative;
        }

        h1 {
          font-size: 2.8em;
          letter-spacing: 2px;
          margin: 0 0 10px;
          position: relative;
          z-index: 2;
          text-shadow: 0 0 5px #ff8ac9;
        }

        .highlight {
          font-size: 3.2em;
          background: linear-gradient(90deg, #ff69b4, #ffc0cb);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: pulse 2s infinite alternate;
          margin: 0;
          z-index: 2;
          position: relative;
        }

        @keyframes pulse {
          from { text-shadow: 0 0 10px #ff69b4; }
          to { text-shadow: 0 0 20px #ff6ec4; }
        }

        #countdown {
          font-size: 1.6em;
          margin: 20px auto;
          color: #ff69b4;
          text-shadow: 0 0 4px #ff69b4, 0 0 8px #ff1493;
        }

        .countdown-box {
          display: inline-block;
          margin: 5px;
          padding: 15px 20px;
          background: rgba(255, 255, 255, 0.07);
          border-radius: 10px;
          box-shadow: 0 0 10px #ff69b4, 0 0 15px #ff1493;
        }

        .countdown-number {
          color: #ffb6c1;
          font-weight: bold;
          font-size: 2.2em;
        }

        .countdown-text {
          color: #fff;
          font-size: 0.8em;
        }

        .gif {
          padding: 20px;
          max-width: 100%;
          height: auto;
          border: 4px solid #ff69b4;
          border-radius: 15px;
          box-shadow: 0 0 15px #ff69b4, 0 0 25px #ff1493;
          animation: pulse-border 2s infinite alternate;
          z-index: 2;
          position: relative;
        }

        @keyframes pulse-border {
          from { box-shadow: 0 0 10px #ff69b4; }
          to { box-shadow: 0 0 30px #ff1493; }
        }

        .lightsticks {
          position: fixed;
          bottom: 10px;
          left: 50%;
          transform: translateX(-50%);
          display: flex;
          gap: 20px;
          z-index: 1;
        }

        .lightstick {
          height: 80px;
          animation: glow 2s infinite alternate ease-in-out, wiggle 0.8s infinite ease-in-out;
          filter: drop-shadow(0 0 5px #ff69b4);
        }

        @keyframes glow {
          from { filter: drop-shadow(0 0 5px #ff69b4); }
          to   { filter: drop-shadow(0 0 15px #ff69b4); }
        }

        @keyframes wiggle {
          0%, 100% { transform: rotate(0deg); }
          25% { transform: rotate(10deg); }
          50% { transform: rotate(0deg); }
          75% { transform: rotate(-10deg); }
        }

        .flipped {
          transform: scaleX(-1);
        }

        body::before {
          content: "";
          position: fixed;
          top: 0; left: 0;
          width: 100%;
          height: 100%;
          background: radial-gradient(circle, #ff69b4 1px, transparent 1px);
          background-size: 20px 20px;
          opacity: 0.04;
          z-index: 0;
          animation: backgroundFade 5s infinite alternate;
        }

        @keyframes backgroundFade {
          from { opacity: 0.02; }
          to   { opacity: 0.07; }
        }

        .floating-stars {
          position: fixed;
          width: 100%;
          height: 100%;
          pointer-events: none;
          overflow: hidden;
          z-index: 0;
        }

        .floating-stars span {
          position: absolute;
          display: block;
          width: 6px;
          height: 6px;
          background: radial-gradient(circle, #fff, #ffb6c1);
          border-radius: 50%;
          opacity: 0.8;
          filter: blur(2px);
          animation: floatUp 8s linear infinite;
        }

        .floating-stars span::before {
          content: "";
          position: absolute;
          width: 100%;
          height: 100%;
          background: radial-gradient(circle, #fff, transparent);
          border-radius: 50%;
          opacity: 0.7;
          animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes floatUp {
          0% {
            transform: translateY(100vh) scale(0.8);
            opacity: 0;
          }
          50% {
            opacity: 0.6;
          }
          100% {
            transform: translateY(-10vh) scale(1.2);
            opacity: 0;
          }
        }

        @keyframes twinkle {
          0%, 100% {
            opacity: 0.3;
            transform: scale(1);
          }
          50% {
            opacity: 1;
            transform: scale(1.5);
          }
        }

        @media (max-width: 768px) {
          h1 { font-size: 2.2em; }
          .highlight { font-size: 2.5em; }
          #countdown { font-size: 1.3em; }
        }

        @media (max-width: 480px) {
          h1 { font-size: 1.8em; }
          .highlight { font-size: 2em; }
          .countdown-box { padding: 10px 15px; }
          .countdown-number { font-size: 2em; }
          .lightstick { height: 45px; }
        }
    </style>
</head>

<body>
<div class="floating-stars">
    <span style="left: 5%; animation-delay: 0s;"></span>
    <span style="left: 15%; animation-delay: 3s;"></span>
    <span style="left: 25%; animation-delay: 1s;"></span>
    <span style="left: 35%; animation-delay: 4s;"></span>
    <span style="left: 45%; animation-delay: 2s;"></span>
    <span style="left: 55%; animation-delay: 5s;"></span>
    <span style="left: 65%; animation-delay: 1s;"></span>
    <span style="left: 75%; animation-delay: 2.5s;"></span>
    <span style="left: 85%; animation-delay: 3.5s;"></span>
    <span style="left: 95%; animation-delay: 1.5s;"></span>
</div>

<h1>Ellie 🐣 & Nida 🥚</h1>
<h1 class="highlight">BLACKPINK Concert Countdown</h1>

<div id="countdown">
    <div class="countdown-box"><span class="countdown-number" id="days">00</span> <span class="countdown-text">days</span></div>
    <div class="countdown-box"><span class="countdown-number" id="hours">00</span> <span class="countdown-text">hours</span></div>
    <div class="countdown-box"><span class="countdown-number" id="minutes">00</span> <span class="countdown-text">minutes</span></div>
    <div class="countdown-box"><span class="countdown-number" id="seconds">00</span> <span class="countdown-text">seconds</span></div>
</div>

<img src="static/images/blackpinkdance.gif" alt="BlackPink Dance GIF" class="gif">

<div class="lightsticks">
    <img src="static/images/lightsticks.jpg" class="lightstick flipped" alt="Lightstick Left">
    <img src="static/images/lightsticks.jpg" class="lightstick" alt="Lightstick Right">
</div>

<script>
    async function fetchCountdown() {
      try {
        const response = await fetch("/countdown");
        const data = await response.json();

        if (data.days === 0 && data.hours === 0 && data.minutes === 0 && data.seconds === 0) {
          triggerConfetti();
          document.getElementById("countdown").innerHTML = "💥 IT’S BLACKPINK TIME 💥";
        } else {
          document.getElementById("days").innerText = data.days;
          document.getElementById("hours").innerText = data.hours;
          document.getElementById("minutes").innerText = data.minutes;
          document.getElementById("seconds").innerText = data.seconds;
        }
      } catch (error) {
        console.error("Error fetching countdown:", error);
        document.getElementById("countdown").innerText = "Failed to load countdown.";
      }
    }

    function triggerConfetti() {
      const duration = 7 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function () {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        confetti(Object.assign({}, defaults, {
          particleCount: 100,
          origin: {
            x: randomInRange(0.1, 0.9),
            y: Math.random() - 0.2
          }
        }));
      }, 250);
    }

    fetchCountdown();
    setInterval(fetchCountdown, 1000);
</script>
</body>
</html>
